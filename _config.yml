title: bagellover08
description: A personal corner of the internet for sharing whatever catches my interest.
baseurl: ""
url: "https://bagellover08.com"
# Public, read-only Worker endpoint; credentials stay in Cloudflare.
spotify_playback_url: "https://bagellover08-spotify-playback.spotify-playback-worker.workers.dev/playback"
markdown: kramdown
collections:
  notes:
    output: true
    permalink: /garden/:name/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - PRODUCT.md
  - DESIGN.md
  - scripts
  - tests
  - spotify-worker
