<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="bagellover08 home"><span class="brand-mark" aria-hidden="true">b.</span><span>bagellover08</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/garden/' | relative_url }}"{% if page.url contains '/garden/' %} aria-current="page"{% endif %}>Garden</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap"><a href="{{ '/garden/' | relative_url }}">Back to the garden <span aria-hidden="true">↗</span></a></footer>
</body>
</html>
