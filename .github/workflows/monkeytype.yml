name: Update Monkeytype aggregates
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monkeytype-aggregates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update aggregates
        env:
          MONKEYTYPE_API_KEY: ${{ secrets.MONKEYTYPE_API_KEY }}
        run: python3 scripts/update_monkeytype.py
      - name: Commit public aggregates only
        run: |
          if git diff --quiet -- _data/monkeytype.json && [ -z "$(git ls-files --others --exclude-standard -- _data/monkeytype.json)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _data/monkeytype.json
          git commit -m 'Update Monkeytype aggregates'
          git push
